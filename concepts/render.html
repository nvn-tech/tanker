<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Bangers&family=Archivo+Narrow:wght@500;700&family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>body{margin:0;background:#222}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../js/util.js"></script>
<script src="../js/content.js"></script>
<script src="../js/art.js"></script>
<script src="heroes.js"></script>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const rng = (s) => () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- shared scene geometry ----------
function island(x0, x1, base, depth, seed, amp = 26) {
  const r = rng(seed);
  const p1 = r() * 6, p2 = r() * 6;
  const top = [], bot = [];
  for (let x = x0; x <= x1 + 0.1; x += 6) {
    const t = (x - x0) / (x1 - x0);
    const edge = (1 - Math.pow(Math.sin(Math.PI * t), 0.3)) * 50;
    top.push([x, base + edge + Math.sin(x * 0.006 + p1) * amp + Math.sin(x * 0.019 + p2) * 7]);
    bot.push([x, base + 26 + depth * Math.pow(Math.sin(Math.PI * t), 0.75) + Math.sin(x * 0.03 + p2) * 8]);
  }
  return { top, bot, x0, x1 };
}
const L = island(70, 600, 470, 190, 7);
const R = island(735, 1225, 420, 210, 19);
const S = island(560, 700, 250, 50, 3, 5);
const topAt = (is, x) => is.top[Math.max(0, Math.min(is.top.length - 1, Math.round((x - is.x0) / 6)))][1];
const HERO = { x: 250, y: topAt(L, 250) };
const FOE = { x: 1050, y: topAt(R, 1050) };
const IMPACT = { x: 925, y: topAt(R, 925) - 14 };
const MUZZLE = { x: HERO.x + 30, y: HERO.y - 40 };
function arcPt(t) { // projectile path
  const x = lerp(MUZZLE.x, IMPACT.x, t);
  const y = lerp(MUZZLE.y, IMPACT.y, t) - Math.sin(Math.PI * t) * 330 - t * t * 0;
  return [x, y];
}
function islandPath(is, jag = 0, seed = 1) {
  const r = rng(seed);
  const p = new Path2D();
  p.moveTo(is.top[0][0], is.top[0][1]);
  for (const [x, y] of is.top) p.lineTo(x + (jag ? (r() - 0.5) * jag : 0), y + (jag ? (r() - 0.5) * jag : 0));
  for (let i = is.bot.length - 1; i >= 0; i--) p.lineTo(is.bot[i][0] + (jag ? (r() - 0.5) * jag : 0), is.bot[i][1] + (jag ? (r() - 0.5) * jag * 2 : 0));
  p.closePath();
  return p;
}
function topPath(is, dy = 0) {
  const p = new Path2D();
  is.top.forEach(([x, y], i) => (i ? p.lineTo(x, y + dy) : p.moveTo(x, y + dy)));
  return p;
}
// draw terrain into an offscreen layer then punch the crater
function terrainLayer(draw) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  draw(g);
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(IMPACT.x, IMPACT.y + 26, 46, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';
  return c;
}

// generic chibi pose; style supplies fills/stroke
function chibi(g, x, y, face, st) {
  g.save(); g.translate(x, y); g.scale(face * st.scale, st.scale);
  const O = st.outline, lw = st.lw;
  const shape = (fn, fill) => { g.beginPath(); fn(); if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw; g.strokeStyle = O; g.stroke(); } };
  shape(() => g.ellipse(-7, -3, 7, 4.5, 0, 0, 7), st.boot);
  shape(() => g.ellipse(8, -3, 7, 4.5, 0, 0, 7), st.boot);
  shape(() => { g.roundRect(-12, -27, 24, 23, 9); }, st.body);
  if (st.bodyDeco) st.bodyDeco(g);
  g.save(); g.translate(3, -18); g.rotate(-st.aim);
  shape(() => g.roundRect(-6, -7, 38, 14, 6), st.gun);
  shape(() => g.roundRect(26, -9, 10, 18, 3), st.gunTip);
  shape(() => g.arc(9, 7, 4.5, 0, 7), st.skin);
  g.restore();
  shape(() => g.arc(0, -43, 18, 0, 7), st.skin);
  shape(() => { g.arc(0, -46, 18, Math.PI * 1.02, Math.PI * 1.98); g.quadraticCurveTo(10, -48, 4, -52); g.quadraticCurveTo(-2, -45, -8, -50); g.quadraticCurveTo(-13, -45, -18, -46); g.closePath(); }, st.hair);
  st.face(g);
  if (st.hat) st.hat(g);
  g.restore();
}

// ================= 1. PAPER SKIES =================
function paper(v2) {
  // construction-paper sky
  g0(ctx, '#bfe3e6');
  fiber(ctx, 2600, ['rgba(255,255,255,0.35)', 'rgba(60,90,90,0.08)'], 1);
  // sun: stacked paper discs
  for (const [r, c] of [[92, '#f9d778'], [70, '#f2b134'], [48, '#f7c95a']]) paperShape(ctx, () => ctx.arc(1080, 120, r, 0, 7), c, 6);
  // paper clouds layers
  const cloud = (x, y, s, c) => paperShape(ctx, () => { ctx.arc(x, y, 30 * s, Math.PI, 0); ctx.arc(x + 40 * s, y - 10 * s, 38 * s, Math.PI, 0); ctx.arc(x + 85 * s, y, 28 * s, Math.PI, 0); ctx.closePath(); }, c, 5);
  cloud(120, 150, 1.2, '#f4ead5'); cloud(560, 110, 0.9, '#fffaf0'); cloud(820, 210, 1.1, '#f4ead5');
  // far paper hills
  for (const [base, c] of [[520, '#9fcbb9'], [580, '#7fb5a3']]) paperShape(ctx, () => { ctx.moveTo(0, H); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, base + Math.sin(x * 0.006 + base) * 40); ctx.lineTo(W, H); ctx.closePath(); }, c, 7);
  // islands as stacked cut paper layers
  const layer = terrainLayer((g) => {
    for (const is of [S, L, R]) {
      g.save(); g.shadowColor = 'rgba(40,30,20,0.35)'; g.shadowOffsetY = 10; g.shadowBlur = 6;
      g.fillStyle = '#8a5a3b'; g.fill(islandPath(is, 5, 11));
      g.restore();
      g.save(); g.clip(islandPath(is, 5, 11));
      g.fillStyle = '#c8a27a'; g.translate(0, 18); g.fill(islandPath(is, 5, 4)); g.translate(0, -18);
      // corrugated cardboard stripes
      g.strokeStyle = 'rgba(120,80,40,0.28)'; g.lineWidth = 2;
      for (let x = is.x0; x < is.x1; x += 9) { g.beginPath(); g.moveTo(x, is.top[0][1] - 80); g.lineTo(x, H); g.stroke(); }
      g.restore();
      // grass paper strip with zigzag scissor edge
      g.save(); g.shadowColor = 'rgba(40,30,20,0.3)'; g.shadowOffsetY = 4; g.shadowBlur = 3;
      g.fillStyle = '#2a9d8f'; g.beginPath();
      is.top.forEach(([x, y], i) => (i ? g.lineTo(x, y - 4) : g.moveTo(x, y - 4)));
      for (let i = is.top.length - 1; i >= 0; i--) { const [x, y] = is.top[i]; g.lineTo(x, y + 14 + (i % 2 ? 6 : 0)); }
      g.closePath(); g.fill(); g.restore();
    }
  });
  ctx.drawImage(layer, 0, 0);
  // crater: torn white fibre rim
  ctx.save(); ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 3; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.arc(IMPACT.x, IMPACT.y + 26, 49, Math.PI * 0.05, Math.PI * 0.95); ctx.stroke(); ctx.restore();
  // paper flowers / pinwheel deco
  for (const [x, c] of [[140, '#e4572e'], [420, '#f2b134'], [800, '#e4572e'], [1160, '#f2b134']]) { const y = topAt(x < 650 ? L : R, x); paperShape(ctx, () => { for (let k = 0; k < 5; k++) { const a = k * 1.256; ctx.moveTo(x, y - 14); ctx.arc(x + Math.cos(a) * 6, y - 14 + Math.sin(a) * 6, 5, 0, 7); } }, c, 2); }
  // trail: pencil dashes
  ctx.save(); ctx.setLineDash([10, 9]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(43,33,24,0.7)'; ctx.beginPath();
  for (let t = 0; t <= 0.93; t += 0.01) { const [x, y] = arcPt(t); t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.restore();
  const pst = { scale: 1.35, outline: '#2b2118', lw: 0, aim: 0.75, boot: '#2b2118', body: '#e4572e', gun: '#c8a27a', gunTip: '#2a9d8f', skin: '#f6d2b0', hair: '#5a3418',
    bodyDeco: (g) => { g.fillStyle = '#d9a441'; g.beginPath(); g.arc(4, -18, 2.5, 0, 7); g.fill(); g.strokeStyle = '#8a6a20'; g.lineWidth = 1; g.stroke(); },
    face: (g) => { g.fillStyle = '#2b2118'; g.beginPath(); g.arc(1, -41, 2.8, 0, 7); g.arc(12, -41, 2.8, 0, 7); g.fill(); g.fillStyle = '#e88a7a'; g.beginPath(); g.ellipse(-6, -35, 4, 2.4, 0, 0, 7); g.fill(); },
    hat: (g) => { g.fillStyle = '#f2b134'; g.beginPath(); g.moveTo(-19, -55); g.lineTo(0, -82); g.lineTo(19, -55); g.closePath(); g.fill(); g.fillStyle = '#e4572e'; g.fillRect(-19, -57, 38, 5); } };
  // white sticker border = draw twice: thick white then normal
  if (v2) {
    ctx.save(); ctx.translate(HERO.x, HERO.y); ctx.scale(1.25, 1.25); drawHero(ctx, 'rookie', 'aim', { t: 0.3 }); ctx.restore();
    ctx.save(); ctx.translate(FOE.x + 10, FOE.y); ctx.scale(-1.25, 1.25); drawHero(ctx, 'brute', 'hit', { t: 0.3 }); ctx.restore();
    ctx.save(); ctx.translate(630, topAt(S, 630)); ctx.scale(1.05, 1.05); drawHero(ctx, 'witch', 'idle', { t: 1.2 }); ctx.restore();
  } else {
  stickerChibi(HERO.x, HERO.y, 1, pst);
  stickerChibi(FOE.x, FOE.y, -1, { ...pst, body: '#2a9d8f', gunTip: '#e4572e', hair: '#2b2118', aim: 0.4, hat: (g) => { g.fillStyle = '#e4572e'; g.beginPath(); g.arc(0, -58, 16, Math.PI, 0); g.fill(); g.fillRect(-4, -78, 8, 8); } });
  }
  // explosion: cut-paper starburst + confetti
  paperShape(ctx, () => star(ctx, IMPACT.x, IMPACT.y, 74, 44, 12), '#f2b134', 6);
  paperShape(ctx, () => star(ctx, IMPACT.x, IMPACT.y, 50, 30, 10, 0.3), '#e4572e', 4);
  const r = rng(5);
  for (let i = 0; i < 26; i++) { const a = r() * 7, d = 70 + r() * 70; ctx.save(); ctx.translate(IMPACT.x + Math.cos(a) * d, IMPACT.y + Math.sin(a) * d * 0.8); ctx.rotate(r() * 3); ctx.fillStyle = ['#e4572e', '#2a9d8f', '#f2b134', '#fffaf0'][i % 4]; ctx.fillRect(-6, -3, 12, 6); ctx.restore(); }
  // damage: stamped label
  ctx.save(); ctx.translate(IMPACT.x - 10, IMPACT.y - 110); ctx.rotate(-0.08);
  paperShape(ctx, () => ctx.roundRect(-70, -30, 140, 60, 6), '#fffaf0', 4);
  ctx.font = '44px "Bagel Fat One"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e4572e'; ctx.fillText('-312', 0, 3); ctx.restore();
  // HUD: craft tags + washi tape
  const tag = (x, y, w, h, c, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); paperShape(ctx, () => { ctx.moveTo(14, 0); ctx.lineTo(w, 0); ctx.lineTo(w, h); ctx.lineTo(14, h); ctx.lineTo(0, h / 2); ctx.closePath(); }, c, 4); ctx.fillStyle = '#c8a27a'; ctx.beginPath(); ctx.arc(14, h / 2, 5, 0, 7); ctx.fill(); ctx.restore(); };
  tag(470, 24, 340, 64, '#fffaf0', 0.01);
  ctx.font = '800 15px Nunito'; ctx.fillStyle = '#2b2118'; ctx.textAlign = 'left'; ctx.fillText('WIND', 500, 62);
  ctx.font = '38px "Bagel Fat One"'; ctx.fillStyle = '#2a9d8f'; ctx.fillText('3.2 →', 560, 71);
  ctx.font = '38px "Bagel Fat One"'; ctx.fillStyle = '#e4572e'; ctx.fillText('12', 740, 71);
  // power bar: strip of paper with tape
  paperShape(ctx, () => ctx.roundRect(330, 640, 620, 46, 4), '#fffaf0', 5);
  paperShape(ctx, () => ctx.roundRect(338, 648, 410, 30, 3), '#e4572e', 0);
  for (let i = 0; i <= 10; i++) { ctx.fillStyle = '#2b2118'; ctx.fillRect(338 + i * 60.4, 676, 2, 8); }
  washi(320, 630, 70, '#2a9d8f'); washi(900, 630, 70, '#f2b134');
  ctx.font = '800 15px Nunito'; ctx.fillStyle = '#2b2118'; ctx.fillText('POWER 68', 760, 670);
  // angle: paper protractor disc with brad
  paperShape(ctx, () => ctx.arc(120, 650, 56, Math.PI, 0), '#f4ead5', 5);
  ctx.strokeStyle = '#e4572e'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(120, 650); ctx.lineTo(120 + Math.cos(-0.75) * 50, 650 + Math.sin(-0.75) * 50); ctx.stroke();
  ctx.fillStyle = '#d9a441'; ctx.beginPath(); ctx.arc(120, 650, 7, 0, 7); ctx.fill();
  ctx.font = '26px "Bagel Fat One"'; ctx.fillStyle = '#2b2118'; ctx.textAlign = 'center'; ctx.fillText('43°', 120, 700);
  // item tiles
  ['×3', '×2', '+50', '♥'].forEach((s, i) => { const x = 990 + i * 70; ctx.save(); ctx.translate(x, 655); ctx.rotate((i % 2 ? 1 : -1) * 0.05); paperShape(ctx, () => ctx.roundRect(-28, -28, 56, 56, 6), ['#f2b134', '#2a9d8f', '#e4572e', '#fffaf0'][i], 4); ctx.font = '24px "Bagel Fat One"'; ctx.fillStyle = i === 3 ? '#e4572e' : '#fffaf0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 2); ctx.restore(); });
  function stickerChibi(x, y, f, st) {
    const off = document.createElement('canvas'); off.width = 260; off.height = 260; const g = off.getContext('2d');
    chibi(g, 130, 200, f, st);
    const out = document.createElement('canvas'); out.width = 260; out.height = 260; const o = out.getContext('2d');
    for (let a = 0; a < 6.28; a += 0.4) o.drawImage(off, Math.cos(a) * 5, Math.sin(a) * 5);
    o.globalCompositeOperation = 'source-in'; o.fillStyle = '#fffaf0'; o.fillRect(0, 0, 260, 260);
    o.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.shadowColor = 'rgba(40,30,20,0.35)'; ctx.shadowOffsetY = 6; ctx.shadowBlur = 4; ctx.drawImage(out, x - 130, y - 200); ctx.restore();
    ctx.drawImage(off, x - 130, y - 200);
  }
  function washi(x, y, w, c) { ctx.save(); ctx.globalAlpha = 0.8; ctx.fillStyle = c; ctx.translate(x, y); ctx.rotate(-0.2); ctx.fillRect(0, 0, w, 20); ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff'; for (let i = 0; i < w; i += 10) ctx.fillRect(i, 0, 4, 20); ctx.restore(); }
}
function paperShape(g, path, fill, sh) {
  g.save(); g.beginPath(); path(); g.shadowColor = 'rgba(40,30,20,0.32)'; g.shadowOffsetY = sh; g.shadowBlur = sh * 0.8; g.fillStyle = fill; g.fill(); g.restore();
}
function star(g, x, y, r1, r2, n, rot = 0) { for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }
function g0(g, c) { g.fillStyle = c; g.fillRect(0, 0, W, H); }
function fiber(g, n, cols, w) { const r = rng(99); for (let i = 0; i < n; i++) { g.strokeStyle = cols[i % cols.length]; g.lineWidth = w; const x = r() * W, y = r() * H, a = r() * 6, l = 3 + r() * 9; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }

// ================= 2. INK & THUNDER =================
function ink() {
  // bokashi sky: indigo fading into washi
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1f3a5f'); sky.addColorStop(0.32, '#2e5e7e'); sky.addColorStop(0.58, '#efe4cc'); sky.addColorStop(1, '#efe4cc');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  fiber(ctx, 1800, ['rgba(255,250,235,0.18)', 'rgba(30,30,30,0.05)'], 1);
  // vermilion sun disc
  ctx.fillStyle = '#d2452b'; ctx.beginPath(); ctx.arc(1060, 190, 86, 0, 7); ctx.fill();
  // stylized cloud bands (scalloped) with ink outline
  const band = (x, y, w, n) => { ctx.beginPath(); ctx.moveTo(x, y); for (let i = 0; i < n; i++) ctx.arc(x + (i + 0.5) * (w / n), y, w / n / 2, Math.PI, 0); ctx.lineTo(x + w, y + 16); ctx.lineTo(x, y + 16); ctx.closePath(); ctx.fillStyle = '#efe4cc'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#1a1a1a'; ctx.stroke(); ctx.strokeStyle = 'rgba(26,26,26,0.5)'; ctx.lineWidth = 1.5; for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(x + (i + 0.5) * (w / n), y, w / n / 4, Math.PI, 0); ctx.stroke(); } };
  band(80, 170, 300, 6); band(940, 250, 260, 5); band(470, 120, 200, 4);
  // distant mountains, striped
  ctx.save(); ctx.fillStyle = '#9fb3b8'; ctx.beginPath(); ctx.moveTo(0, 560); [[0, 560], [180, 400], [300, 470], [470, 330], [640, 500], [820, 380], [1000, 520], [1280, 420], [1280, 720], [0, 720]].forEach(([x, y]) => ctx.lineTo(x, y)); ctx.fill(); ctx.restore();
  // swirl wave curls at bottom (Hokusai-ish but our own)
  for (let i = 0; i < 9; i++) { const x = 60 + i * 150, y = 640; ctx.fillStyle = '#1f3a5f'; ctx.beginPath(); ctx.arc(x, y, 70, Math.PI, 0); ctx.fill(); ctx.strokeStyle = '#efe4cc'; ctx.lineWidth = 3; for (const r of [56, 40, 24]) { ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); } }
  const layer = terrainLayer((g) => {
    for (const is of [S, L, R]) {
      const p = islandPath(is);
      g.fillStyle = '#2e5e7e'; g.fill(p);
      g.save(); g.clip(p);
      // strata lines
      g.strokeStyle = '#1f3a5f'; g.lineWidth = 6;
      for (let k = 1; k < 9; k++) { g.beginPath(); is.top.forEach(([x, y], i) => (i ? g.lineTo(x, y + k * 26 + Math.sin(x * 0.03 + k) * 5) : g.moveTo(x, y + k * 26))); g.stroke(); }
      // ochre top band
      g.lineWidth = 36; g.strokeStyle = '#d9a441'; g.stroke(topPath(is, 0));
      g.restore();
      g.lineWidth = 5; g.strokeStyle = '#1a1a1a'; g.lineJoin = 'round'; g.stroke(p);
      g.lineWidth = 4; g.stroke(topPath(is, 18));
    }
  });
  ctx.drawImage(layer, 0, 0);
  // pines
  const pine = (x, y, s) => { ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x - 2, y - 40 * s, 4, 40 * s); for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x + (k - 1) * 10 * s, y - 40 * s - k * 12 * s, 22 * s, 7 * s, 0, 0, 7); ctx.fillStyle = '#2f4a3a'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1a1a1a'; ctx.stroke(); } };
  pine(130, topAt(L, 130), 1.1); pine(470, topAt(L, 470), 0.9); pine(1180, topAt(R, 1180), 1);
  // brush-stroke trail, tapering
  for (let t = 0.02; t <= 0.92; t += 0.006) { const [x, y] = arcPt(t); ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(x, y, 2.5 + t * 6, 0, 7); ctx.fill(); ctx.fillStyle = '#efe4cc'; ctx.beginPath(); ctx.arc(x, y, 1 + t * 4.5, 0, 7); ctx.fill(); }
  const ist = { scale: 1.35, outline: '#1a1a1a', lw: 2.6, aim: 0.75, boot: '#1a1a1a', body: '#d2452b', gun: '#3a3a3a', gunTip: '#d9a441', skin: '#f3e2c7', hair: '#1a1a1a',
    bodyDeco: (g) => { g.strokeStyle = '#efe4cc'; g.lineWidth = 2; g.beginPath(); g.arc(0, -16, 5, 0, 7); g.stroke(); g.beginPath(); g.moveTo(-5, -16); g.lineTo(5, -16); g.stroke(); },
    face: (g) => { g.strokeStyle = '#1a1a1a'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-2, -42); g.lineTo(5, -40); g.moveTo(9, -40); g.lineTo(16, -42); g.stroke(); g.fillStyle = '#d2452b'; g.beginPath(); g.arc(7, -32, 2, 0, 7); g.fill(); },
    hat: (g) => { g.beginPath(); g.ellipse(0, -58, 28, 7, 0, 0, 7); g.fillStyle = '#d9a441'; g.fill(); g.lineWidth = 2.6; g.strokeStyle = '#1a1a1a'; g.stroke(); g.beginPath(); g.moveTo(-14, -60); g.quadraticCurveTo(0, -78, 14, -60); g.fill(); g.stroke(); } };
  chibi(ctx, HERO.x, HERO.y, 1, ist);
  chibi(ctx, FOE.x, FOE.y, -1, { ...ist, body: '#2e5e7e', aim: 0.4, hat: (g) => { g.fillStyle = '#1a1a1a'; g.beginPath(); g.moveTo(-6, -62); g.lineTo(0, -80); g.lineTo(6, -62); g.fill(); g.fillRect(-18, -62, 36, 6); } });

// ================= STORYBOOK INK WORLD =================
function inkSky() {

  }
}
function inkIsland(g, is) {

  for (let i = 4; i < is.bot.length - 4; i += 7) { const [x, y] = is.bot[i]; g.beginPath(); g.moveTo(x, y - 4); g.quadraticCurveTo(x + (r() - 0.5) * 20, y + 18, x + (r() - 0.5) * 14, y + 20 + r() * 26); g.stroke(); }
  C(g, () => { g.beginPath(); g.addPath ? null : null; const pp = islandPath(is); g.beginPath(); is.top.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); for (let i = is.bot.length - 1; i >= 0; i--) g.lineTo(is.bot[i][0], is.bot[i][1]); g.closePath(); }, '#d9955b', { line: '#5a3218', lw: 4, sx: 10, sy: -8, shadeColor: '#b8743f' });

function inkworld(lineupMode) {

    cast.forEach(([id, pose, f], i) => { const x = 130 + i * 205; ctx.save(); ctx.translate(x, topAt(is, x) + 2); ctx.scale(1.7 * f, 1.7); drawHero(ctx, id, pose, { t: 0.4 + i * 0.7 }); ctx.restore(); });

  }
  ctx.fillStyle = '#fff6b0'; for (let i = 0; i < 8; i++) { const a = rr() * 7, d = 80 + rr() * 40, x = IMPACT.x + Math.cos(a) * d, y = IMPACT.y - 14 + Math.sin(a) * d * 0.7; ctx.beginPath(); for (let k = 0; k < 8; k++) { const q = k % 2 ? 2 : 7, b = (k * Math.PI) / 4; ctx.lineTo(x + Math.cos(b) * q, y + Math.sin(b) * q); } ctx.closePath(); ctx.fill(); }

  ctx.lineWidth = 12; ctx.strokeStyle = '#5a1f10'; ctx.strokeText('-312', 0, 0); ctx.fillStyle = '#ff5a3c'; ctx.fillText('-312', 0, 0); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText('-312', -2, -3); ctx.restore();

  panel(500, 22, 280, 66);
  ctx.font = '800 14px Nunito'; ctx.fillStyle = '#8a5a34'; ctx.textAlign = 'left'; ctx.fillText('WIND', 524, 50);
  ctx.font = '36px "Bagel Fat One"'; ctx.fillStyle = '#2f8fd0'; ctx.fillText('3.2 →', 524, 82);

  ctx.strokeStyle = '#ff5a3c'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(104, 660); ctx.lineTo(104 + Math.cos(-0.75) * 34, 660 + Math.sin(-0.75) * 34); ctx.stroke();

  ['×3', '×2', '+50', '♥'].forEach((t, i) => { const x = 990 + i * 64; ctx.fillStyle = '#c99a62'; ctx.beginPath(); ctx.roundRect(x - 26, 637, 52, 52, 12); ctx.fill(); ctx.fillStyle = ['#ffd23f', '#6dbdf0', '#ff7a3c', '#ff7aa8'][i]; ctx.beginPath(); ctx.roundRect(x - 26, 631, 52, 52, 12); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#5a3218'; ctx.stroke(); ctx.font = '22px "Bagel Fat One"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeText(t, x, 665); ctx.fillText(t, x, 665); });
